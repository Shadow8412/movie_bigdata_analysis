# =============================================================================
# Docker Compose — 电影评分大数据分析系统 一键环境
# 启动: docker compose up -d
# 停止: docker compose down
# =============================================================================
services:
  # ==================== HDFS NameNode ====================
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop2.7.4-java8
    container_name: namenode
    hostname: namenode
    environment:
      - CLUSTER_NAME=movie_cluster
    env_file:
      - ./docker/hadoop.env
    ports:
      - "50070:50070"  # HDFS Web UI (Hadoop 2.x)
      - "8020:8020"    # HDFS RPC
    volumes:
      - namenode_data:/hadoop/dfs/name
      - ./data/processed:/data/processed
    networks:
      - movie_net

  # ==================== HDFS DataNode ====================
  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop2.7.4-java8
    container_name: datanode
    hostname: datanode
    environment:
      - CLUSTER_NAME=movie_cluster
    env_file:
      - ./docker/hadoop.env
    ports:
      - "50075:50075"  # DataNode Web UI (Hadoop 2.x)
      - "50010:50010"  # DataNode 数据传输
    volumes:
      - datanode_data:/hadoop/dfs/data
    networks:
      - movie_net
    depends_on:
      - namenode

  # ==================== Hive Metastore (PostgreSQL) ====================
  hive-metastore-db:
    image: postgres:9.6
    container_name: hive-metastore-db
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - movie_net

  # ==================== Hive Metastore Service ====================
  hive-metastore:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: hive-metastore
    depends_on:
      - hive-metastore-db
      - namenode
    env_file:
      - ./docker/hadoop.env
    environment:
      - SERVICE_NAME=metastore
      - DB_DRIVER=postgres
    ports:
      - "9083:9083"
    networks:
      - movie_net

  # ==================== HiveServer2 ====================
  hive-server:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: hive-server
    depends_on:
      - hive-metastore
      - namenode
    env_file:
      - ./docker/hadoop.env
    environment:
      - SERVICE_NAME=hiveserver2
      - HIVE_SITE_CONF_javax_jdo_option_ConnectionURL=jdbc:postgresql://hive-metastore-db:5432/metastore
      - HIVE_SITE_CONF_javax_jdo_option_ConnectionDriverName=org.postgresql.Driver
      - HIVE_SITE_CONF_javax_jdo_option_ConnectionUserName=hive
      - HIVE_SITE_CONF_javax_jdo_option_ConnectionPassword=hive
    ports:
      - "10000:10000"   # HiveServer2 Thrift
      - "10002:10002"   # HiveServer2 Web UI
    volumes:
      - ./data/processed:/data/processed
      - ./hive:/hive-scripts    # 挂载Hive脚本
    networks:
      - movie_net

  # ==================== MySQL 5.7 ====================
  mysql:
    image: mysql:5.7
    container_name: movie-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: movie_analysis
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./output/mysql_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    networks:
      - movie_net
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password

volumes:
  namenode_data:
  datanode_data:
  pg_data:
  mysql_data:

networks:
  movie_net:
    driver: bridge
